<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connexion — RPGG</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="login-main">
    <div class="login-card">
      <h1 class="brand">RPGG</h1>
      <p class="hint">
        Connecte-toi avec un token GitHub personnel (fine-grained, permission
        "Contents" sur ce dépôt — lecture seule si tu es simple joueur,
        lecture/écriture si tu es MJ). Ton compte GitHub doit être listé dans
        <code>content/users.json</code>.
      </p>
      <label for="token-input">Token GitHub</label>
      <input type="password" id="token-input" placeholder="ghp_… ou github_pat_…" autocomplete="off" />
      <button id="login-btn">Se connecter</button>
      <p id="status-msg"></p>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script>
    const tokenInput = document.getElementById("token-input");
    const btn = document.getElementById("login-btn");
    const statusMsg = document.getElementById("status-msg");

    if (RPGG.getSession()) location.href = "index.html";

    async function doLogin() {
      const token = tokenInput.value.trim();
      if (!token) return;
      btn.disabled = true;
      statusMsg.textContent = "Connexion…";
      statusMsg.className = "";
      try {
        await RPGG.login(token);
        location.href = "index.html";
      } catch (err) {
        statusMsg.textContent = err.message;
        statusMsg.className = "error";
        btn.disabled = false;
      }
    }

    btn.addEventListener("click", doLogin);
    tokenInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") doLogin();
    });
  </script>
</body>
</html>
