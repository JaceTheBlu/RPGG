<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Éditeur — RPGG</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site">
    <a class="brand" href="index.html">RPGG</a>
    <nav>
      <a href="index.html">Pages</a>
      <a href="#" id="logout-link">Déconnexion</a>
    </nav>
  </header>
  <main>
    <div class="toolbar">
      <input type="text" id="title-input" placeholder="Titre de la page" />
      <select id="visibility-select">
        <option value="public">Visible par tous</option>
        <option value="gm">Réservé au MJ</option>
      </select>
      <button id="publish-btn">Publier</button>
      <button id="delete-btn" class="danger" hidden>Supprimer</button>
      <span id="status-msg"></span>
    </div>
    <div class="editor-layout">
      <textarea id="md-input" placeholder="# Écris ton Markdown ici…" spellcheck="false"></textarea>
      <div id="md-preview"></div>
    </div>
  </main>

  <script src="js/vendor/marked.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    const session = RPGG.requireSession();
    if (session && session.role !== "gm") {
      location.href = "index.html";
    } else if (session) {
      document.getElementById("logout-link").addEventListener("click", (e) => {
        e.preventDefault();
        RPGG.clearSession();
        location.href = "login.html";
      });

      const params = new URLSearchParams(location.search);
      const editSlug = params.get("slug");
      const editVisibility = params.get("v") === "gm" ? "gm" : "public";

      const titleInput = document.getElementById("title-input");
      const visibilitySelect = document.getElementById("visibility-select");
      const mdInput = document.getElementById("md-input");
      const preview = document.getElementById("md-preview");
      const statusMsg = document.getElementById("status-msg");
      const publishBtn = document.getElementById("publish-btn");
      const deleteBtn = document.getElementById("delete-btn");

      function updatePreview() {
        preview.innerHTML = RPGG.renderMarkdown(mdInput.value || "");
      }
      mdInput.addEventListener("input", updatePreview);

      function setStatus(msg, type) {
        statusMsg.textContent = msg;
        statusMsg.className = type || "";
      }

      let currentSlug = null;
      let currentVisibility = "public";

      async function loadForEdit(slug, visibility) {
        try {
          setStatus("Chargement de la page…");
          const raw = await RPGG.fetchPage(slug, visibility);
          const { meta, body } = RPGG.parseFrontMatter(raw);
          titleInput.value = meta.title || slug;
          visibilitySelect.value = visibility;
          mdInput.value = body.trim();
          currentSlug = slug;
          currentVisibility = visibility;
          deleteBtn.hidden = false;
          updatePreview();
          setStatus("");
        } catch (err) {
          setStatus(`Erreur : ${err.message}`, "error");
        }
      }

      publishBtn.addEventListener("click", async () => {
        const title = titleInput.value.trim();
        if (!title) return setStatus("Un titre est requis.", "error");
        if (!mdInput.value.trim()) return setStatus("Le contenu est vide.", "error");
        const visibility = visibilitySelect.value;
        const slug = currentSlug || RPGG.slugify(title);
        publishBtn.disabled = true;
        setStatus("Publication en cours…");
        try {
          await RPGG.publishPage({ slug, title, markdown: mdInput.value, visibility, token: session.token });
          currentSlug = slug;
          currentVisibility = visibility;
          deleteBtn.hidden = false;
          setStatus("Publié ✓", "ok");
        } catch (err) {
          setStatus(`Erreur : ${err.message}`, "error");
        } finally {
          publishBtn.disabled = false;
        }
      });

      deleteBtn.addEventListener("click", async () => {
        if (!currentSlug) return;
        if (!confirm(`Supprimer la page "${titleInput.value}" ?`)) return;
        try {
          await RPGG.deletePage(currentSlug, currentVisibility, titleInput.value, session.token);
          location.href = "index.html";
        } catch (err) {
          setStatus(`Erreur : ${err.message}`, "error");
        }
      });

      if (editSlug) {
        loadForEdit(editSlug, editVisibility);
      } else {
        updatePreview();
      }
    }
  </script>
</body>
</html>
