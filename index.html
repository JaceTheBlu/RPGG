<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RPGG</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site">
    <a class="brand" href="index.html">RPGG</a>
    <nav>
      <span id="who"></span>
      <a href="editor.html" id="new-page-link" hidden>+ Nouvelle page</a>
      <a href="#" id="logout-link">Déconnexion</a>
    </nav>
  </header>
  <main>
    <h1>Pages</h1>
    <ul class="page-list" id="page-list">
      <li class="empty-state">Chargement…</li>
    </ul>
  </main>

  <script src="js/vendor/marked.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    const session = RPGG.requireSession();
    if (session) {
      document.getElementById("who").innerHTML = `${session.displayName}<span class="role-badge">${session.role === "gm" ? "MJ" : "Joueur"}</span>`;
      document.getElementById("logout-link").addEventListener("click", (e) => {
        e.preventDefault();
        RPGG.clearSession();
        location.href = "login.html";
      });

      (async () => {
        const list = document.getElementById("page-list");
        if (session.role === "gm") document.getElementById("new-page-link").hidden = false;
        try {
          const pages = await RPGG.listPages({ includeGm: session.role === "gm" });
          if (!pages.length) {
            list.innerHTML = session.role === "gm"
              ? '<li class="empty-state">Aucune page publiée pour le moment. <a href="editor.html">Crée la première</a>.</li>'
              : '<li class="empty-state">Aucune page publiée pour le moment.</li>';
            return;
          }
          list.innerHTML = "";
          for (const page of pages) {
            const li = document.createElement("li");
            const tag = page.visibility === "gm" ? '<span class="gm-tag">MJ</span>' : "";
            li.innerHTML = `<a href="view.html?slug=${encodeURIComponent(page.slug)}&v=${page.visibility}">${page.slug}</a>${tag}`;
            list.appendChild(li);
          }
        } catch (err) {
          list.innerHTML = `<li class="empty-state">Erreur de chargement : ${err.message}</li>`;
        }
      })();
    }
  </script>
</body>
</html>
